<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주변맛집</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F4EF; --card: #fff; --primary: #0b2d85; --primary-light: #1a4ab5;
    --accent: #E8732A; --accent-light: #FDF0E8; --text: #1A1A1A; --muted: #6B6B6B;
    --border: #E8E3DA;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 3rem; }

  .header { background: var(--primary); color: white; padding: 1.25rem; display: flex; align-items: center; gap: 12px; }
  .back-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 4px; -webkit-tap-highlight-color: transparent; }
  .header-text h1 { font-size: 18px; font-weight: 700; }
  .header-text p { font-size: 12px; opacity: 0.7; margin-top: 2px; }

  .wrap { padding: 1rem; }
  .add-btn { width: 100%; padding: 12px; border: 1.5px dashed var(--border); border-radius: 12px; background: none; font-family: inherit; font-size: 14px; color: var(--muted); cursor: pointer; margin-bottom: 1rem; -webkit-tap-highlight-color: transparent; }

  .matjip-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.25rem; margin-bottom: 10px; }
  .matjip-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .matjip-menu { display: inline-block; background: var(--accent-light); color: var(--accent); font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 10px; margin-bottom: 6px; }
  .matjip-intro { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }
  .matjip-footer { display: flex; align-items: center; justify-content: space-between; }
  .matjip-nick { font-size: 12px; color: var(--muted); }
  .matjip-actions { display: flex; gap: 8px; align-items: center; }
  .like-btn { display: flex; align-items: center; gap: 4px; padding: 6px 12px; border: 1.5px solid var(--border); border-radius: 20px; background: none; font-family: inherit; font-size: 13px; cursor: pointer; color: var(--muted); -webkit-tap-highlight-color: transparent; transition: all 0.15s; }
  .like-btn.liked { background: #FEF2F2; border-color: #FCA5A5; color: #DC2626; }
  .naver-map-btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; background: #03C75A; color: white; border: none; border-radius: 20px; font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer; text-decoration: none; -webkit-tap-highlight-color: transparent; }

  /* 등록 모달 */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: flex-end; }
  .modal-overlay.show { display: flex; }
  .modal-box { background: white; border-radius: 20px 20px 0 0; padding: 1.5rem; width: 100%; max-height: 85vh; overflow-y: auto; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 1rem; color: var(--primary); }
  .modal-input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 14px; margin-bottom: 10px; background: var(--bg); }
  .modal-input:focus { outline: none; border-color: var(--primary); }
  .modal-btn { width: 100%; padding: 13px; border: none; border-radius: 12px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; }
  .modal-btn-primary { background: var(--primary); color: white; }
  .modal-btn-cancel { background: var(--bg); color: var(--muted); }

  .loading { text-align: center; padding: 3rem; color: var(--muted); }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .no-data { text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .no-data .emoji { font-size: 40px; margin-bottom: 1rem; }
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="header-text">
    <h1>📍 주변맛집</h1>
    <p>직원들이 추천하는 맛집 모음</p>
  </div>
</div>

<div class="wrap">
  <button class="add-btn" onclick="showMatjipForm()">+ 맛집 추천하기</button>
  <div id="matjipList"><div class="loading"><div class="spinner"></div>불러오는 중...</div></div>
</div>

<!-- 등록 모달 -->
<div class="modal-overlay" id="matjipModal">
  <div class="modal-box">
    <div class="modal-title">📍 맛집 추천하기</div>
    <input class="modal-input" id="mName" placeholder="식당 이름 *">
    <input class="modal-input" id="mMenu" placeholder="추천 메뉴 * (예: 돈까스정식)">
    <textarea class="modal-input" id="mIntro" placeholder="한줄 소개 (선택, 예: 점심 줄서도 먹을 가치있음!)" style="height:70px;resize:none"></textarea>
    <input class="modal-input" id="mNick" placeholder="닉네임 (선택, 기본: 익명)">
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">※ 관리자 승인 후 공개됩니다</div>
    <button class="modal-btn modal-btn-primary" onclick="submitMatjip()">추천하기</button>
    <button class="modal-btn modal-btn-cancel" onclick="closeModal()">취소</button>
  </div>
</div>

<script>
const WORKER_URL = 'https://meal-worker-test.dltpcjsrnr.workers.dev';

let userId = localStorage.getItem('userId');
if (!userId) { userId = 'u' + Date.now() + Math.random().toString(36).slice(2); localStorage.setItem('userId', userId); }

async function loadMatjip() {
  const el = document.getElementById('matjipList');
  try {
    const resp = await fetch(WORKER_URL + '/matjip');
    const list = await resp.json();
    if (!list.length) {
      el.innerHTML = '<div class="no-data"><div class="emoji">🍽</div><h3>아직 추천된 맛집이 없어요</h3><p style="font-size:13px;color:var(--muted);margin-top:4px">첫 번째 맛집을 추천해보세요!</p></div>';
      return;
    }
    el.innerHTML = list.map(m => {
      const liked = (m.likedBy || []).includes(userId);
      return `
        <div class="matjip-card">
          <div class="matjip-name">${m.name}</div>
          <div class="matjip-menu">🍴 ${m.menu}</div>
          ${m.intro ? `<div class="matjip-intro">"${m.intro}"</div>` : ''}
          <div class="matjip-footer">
            <div class="matjip-nick">추천: ${m.nickname}</div>
            <div class="matjip-actions">
              <a class="naver-map-btn" href="https://map.naver.com/v5/search/${encodeURIComponent(m.name)}" target="_blank">🗺 지도</a>
              <button class="like-btn ${liked ? 'liked' : ''}" onclick="toggleLike(${m.id}, this)">❤️ ${m.likes || 0}</button>
            </div>
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    el.innerHTML = '<div style="color:red;padding:1rem">불러오기 실패</div>';
  }
}

async function toggleLike(id, btn) {
  try {
    const resp = await fetch(WORKER_URL + '/matjip/like', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, userId })
    });
    const data = await resp.json();
    btn.classList.toggle('liked', data.liked);
    btn.textContent = '❤️ ' + data.likes;
  } catch(e) {}
}

function showMatjipForm() {
  document.getElementById('matjipModal').classList.add('show');
}

function closeModal() {
  document.getElementById('matjipModal').classList.remove('show');
}

async function submitMatjip() {
  const name = document.getElementById('mName').value.trim();
  const menu = document.getElementById('mMenu').value.trim();
  if (!name || !menu) { alert('식당 이름과 추천 메뉴는 필수입니다'); return; }
  const intro = document.getElementById('mIntro').value.trim();
  const nickname = document.getElementById('mNick').value.trim() || '익명';
  try {
    const resp = await fetch(WORKER_URL + '/matjip', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, menu, intro, nickname })
    });
    const data = await resp.json();
    if (data.success) {
      alert('✅ 추천해주셔서 감사합니다!\n관리자 승인 후 공개됩니다 😊');
      closeModal();
      ['mName','mMenu','mIntro','mNick'].forEach(id => document.getElementById(id).value = '');
    } else throw new Error(data.error);
  } catch(e) { alert('오류: ' + e.message); }
}

loadMatjip();
</script>
</body>
</html>
